<style>
:root{--paper:#F7F4EC;--paper-2:#EFEAE0;--ink:#22241D;--ink-2:#4A4C42;--red:#CE1F26;--red-dark:#A61920;--field:#2F5B33;--line:#DCD5C4;--white:#FFFFFF;--radius:10px;--scroll:#BDB29A;--scroll-h:#9A8F76;--display:'Forum',serif;--body:'Golos Text',system-ui,-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--paper);scrollbar-width:thin;scrollbar-color:var(--scroll) var(--paper-2)}
::-webkit-scrollbar{width:12px}::-webkit-scrollbar-track{background:var(--paper-2)}
::-webkit-scrollbar-thumb{background:var(--scroll);border:3px solid var(--paper-2);border-radius:99px;background-clip:padding-box}
body{font-family:var(--body);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.tricolor{display:block;height:3px;background:linear-gradient(90deg,var(--field) 0 33.4%,#C9C1AE 33.4% 66.7%,var(--red) 66.7% 100%)}
.header{border-bottom:1px solid var(--line);background:var(--paper)}
.header .wrap{display:flex;justify-content:center;padding:18px 24px}
.brand__svg{display:block;width:200px;height:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
.box{max-width:560px;text-align:center}
.code{font-family:var(--display);font-size:clamp(96px,18vw,170px);line-height:1;color:var(--line);letter-spacing:.04em;user-select:none}
.code b{font-weight:400;color:var(--red)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,38px);margin:10px 0 12px}
p{color:var(--ink-2);font-size:16.5px;margin-bottom:28px}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 26px;border-radius:10px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .15s,background .15s}
.btn--red{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(206,31,38,.25)}
.btn--red:hover{background:var(--red-dark);transform:translateY(-1px)}
.btn--ghost{border:1.5px solid var(--ink);color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--paper)}
.footer{background:var(--ink);color:#B9B6A8;padding:20px 24px;text-align:center;font-size:13.5px}
@media(pointer:coarse){.btn{min-height:44px}}
</style>
</head>
